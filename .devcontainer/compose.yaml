name: meshbee

# Used by both `docker compose` from a terminal and by VS Code's
# devcontainer.json, so the two can't drift apart.
services:
  docs:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/meshbee
    volumes:
      - ..:/workspaces/meshbee:cached
    ports:
      # Host port is overridable — 8000 is a popular default and another
      # container or dev server may already hold it. `DOCS_PORT=8001 docker
      # compose ... up -d` then serves on http://localhost:8001/meshbee/.
      # Container-side stays 8000 to match `mkdocs serve -a 0.0.0.0:8000`.
      - "${DOCS_PORT:-8000}:8000"
    environment:
      # Nothing in the build needs this — the contract artifacts live upstream and
      # are never fetched here. Kept because `gh` is on the image and a token makes
      # it usable for issues and PRs from inside the container.
      GH_TOKEN: "${GH_TOKEN:-}"
    # `up -d` serves straight away — no second exec needed. 0.0.0.0 because the
    # default loopback bind would only be reachable from inside the container.
    # VS Code sets overrideCommand:true in devcontainer.json to replace this
    # with a keepalive, so a serve crash can't kill the editor's shell.
    command: mkdocs serve -a 0.0.0.0:8000

  # HTTPS front end, for parity with GitHub Pages (which serves TLS).
  # Starts and stops with `up`/`down` alongside docs — no profile flag.
  # Needs certs from `./make-certs.sh` (run once); without them it exits with
  # instructions rather than failing cryptically, and HTTP keeps working.
  #   → https://localhost:8443/meshbee/
  proxy:
    image: caddy:2-alpine
    depends_on: [docs]
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated by make-certs.sh and gitignored — never commit private keys.
      - ./certs:/certs:ro
    # Guard before handing off to Caddy: a missing cert is the one predictable
    # failure here, and Caddy's own error for it doesn't say how to fix it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /certs/localhost.pem ] || [ ! -f /certs/localhost-key.pem ]; then
          echo "─────────────────────────────────────────────────────────────"
          echo " No TLS certs found in .devcontainer/certs/"
          echo " HTTPS is off; HTTP still works on http://localhost:${DOCS_PORT:-8000}/meshbee/"
          echo ""
          echo " To enable HTTPS, run this once on your host, then 'up -d' again:"
          echo "   ./.devcontainer/make-certs.sh"
          echo "─────────────────────────────────────────────────────────────"
          exit 0
        fi
        # mkdocs announces its own container-internal bind (0.0.0.0:8000),
        # which says nothing about TLS. Print the URL you'd actually open, so
        # `up` doesn't imply HTTP is the only way in.
        echo "─────────────────────────────────────────────────────────────"
        echo " MeshBee docs"
        echo "   HTTPS  https://localhost:${HTTPS_PORT:-8443}/meshbee/"
        echo "   HTTP   http://localhost:${DOCS_PORT:-8000}/meshbee/"
        echo "─────────────────────────────────────────────────────────────"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
