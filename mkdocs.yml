site_name: MeshBee
site_description: Solar ESP32 hives → MQTT → FastAPI → app. Docs, architecture, and the versioned contract.
site_url: https://fablab-imperia.github.io/meshbee/
copyright: © Fablab Imperia APS — content CC BY-SA 4.0, code GPL-3.0, hardware CERN-OHL-S v2

repo_url: https://github.com/fablab-imperia/meshbee
repo_name: fablab-imperia/meshbee
edit_uri: edit/main/docs/

theme:
  name: material
  language: en                # overridden per-locale by the i18n plugin
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    alternate: material/web    # reads as "language", unlike the default translate glyph
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:                      # brand colors are defined in stylesheets/extra.css
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to light mode }

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix          # matches the .it.md convention
      languages:
        - locale: en
          name: 🇬🇧 English
          default: true
          build: true
        - locale: it
          name: 🇮🇹 Italiano
          build: true
          nav_translations:
            Home: Home
            Architecture: Architettura
            Components: Componenti
            Hive: Arnia
            Hardware: Hardware
            Firmware: Firmware
            Server: Server
            MQTT: MQTT
            API: API
            Core & database: Core e database
            App: App
            Roadmap: Roadmap
            Contract: Contratto
            Overview: Panoramica
            API reference: Riferimento API
            MQTT payload: Payload MQTT
            Compatibility matrix: Matrice di compatibilità
            Get involved: Partecipa
            Contribute: Contribuisci
            Build & preview the docs: Build e anteprima

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences:
      custom_fences:                  # Material bundles Mermaid.js — no extra pip dependency
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.emoji:                 # icons in the landing-page cards
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Components:
      - Overview: components/index.md
      - Hive:
          - Hardware: components/hive/hardware.md
          - Firmware: components/hive/firmware.md
      - Server:
          - MQTT: components/server/mqtt.md
          - API: components/server/api.md
          - Core & database: components/server/core.md
      - App: components/app.md
  - Roadmap: roadmap.md
  - Contract:
      - Overview: contract/index.md
      - API reference: contract/api.md
      - MQTT payload: contract/mqtt-payload.md
      - Compatibility matrix: contract/compatibility.md
  - Get involved:
      - Contribute: contribute.md
      - Build & preview the docs: develop.md
